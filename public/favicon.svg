<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark rounded-square background -->
  <rect width="32" height="32" rx="6" fill="#0d0d1a"/>

  <!--
    Play-button triangle: (6,5) → (26,16) → (6,27)
    Subdivided into 4 by connecting the midpoints of each side:
      M1 = mid of top edge     = (16, 10.5)
      M2 = mid of bottom edge  = (16, 21.5)
      M3 = mid of left edge    = ( 6, 16  )
  -->

  <!-- Top-left: green -->
  <polygon points="6,5 16,10.5 6,16"      fill="#22c55e"/>
  <!-- Right point: yellow/amber -->
  <polygon points="16,10.5 26,16 16,21.5" fill="#eab308"/>
  <!-- Bottom-left: blue -->
  <polygon points="6,16 16,21.5 6,27"     fill="#3b82f6"/>
  <!-- Centre (inverted): red -->
  <polygon points="16,10.5 6,16 16,21.5"  fill="#ef4444"/>
</svg>
